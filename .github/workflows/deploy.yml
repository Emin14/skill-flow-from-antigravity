name: CI/CD Build and Deploy

on:
  push:
    branches: [ main ]

# Два пуша подряд не должны запускать два параллельных деплоя на одном сервере:
# они гоняют `compose up` и `migrate deploy` конкурентно.
concurrency:
  group: deploy-main
  cancel-in-progress: false   # НЕ отменяем идущий деплой: он может быть в середине миграции

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (with Caching)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/emin14/skill-flow-from-antigravity:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Migration Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: ghcr.io/emin14/skill-flow-from-antigravity:migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Без этого шаги не останавливаются на первой ошибке: провал миграции
          # раньше всё равно вёл к `up -d app`, и джоба оставалась зелёной.
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail

            cd /opt/skillflow

            # --- 1. Бэкап ДО любых изменений схемы ---
            # Провал бэкапа останавливает деплой: без точки отката миграции не применяем.
            /opt/skillflow/scripts/backup-db.sh

            # --- 2. Образы ---
            docker compose pull app
            docker compose pull migrate

            # --- 3. База и миграции ---
            docker compose up -d postgres
            docker compose run --rm migrate

            # --- 4. Приложение ---
            docker compose up -d --no-deps app

            # --- 5. Проверка живости ---
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
              [ "$code" = "200" ] && break
              sleep 2
            done
            if [ "$code" != "200" ]; then
              echo "::error::app did not become healthy (last HTTP $code)"
              docker compose logs --tail=50 app
              exit 1
            fi
            echo "app is healthy"

            # --- 6. Уборка старых образов ---
            # Каждый деплой иначе оставляет ~2.7 GB dangling (latest + migrate предыдущей сборки).
            docker image prune -f
