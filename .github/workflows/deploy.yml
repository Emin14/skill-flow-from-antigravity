name: CI/CD Build and Deploy

on:
  push:
    branches: [ main ]

# Два пуша подряд не должны запускать два параллельных деплоя на одном сервере:
# они гоняют `compose up` и `migrate deploy` конкурентно.
concurrency:
  group: deploy-main
  cancel-in-progress: false   # НЕ отменяем идущий деплой: он может быть в середине миграции

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (with Caching)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/emin14/skill-flow-from-antigravity:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Migration Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: ghcr.io/emin14/skill-flow-from-antigravity:migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deliver deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: scripts/deploy.sh
          target: /opt/skillflow
          overwrite: true

      # script_stop НЕ включаем. Он разбивает скрипт построчно и вставляет
      # проверку `$?` после КАЖДОЙ строки, поэтому любая строка, штатно
      # возвращающая не 0 (`[ cond ] && break` в цикле ожидания, `grep` без
      # совпадений), обрывает деплой. Проверено: сборка прошла, `up -d app`
      # выполнился, а джоба упала на строке `[ "$code" = "200" ] && break`.
      # Защиту от ошибок даёт `set -euo pipefail` внутри самого скрипта.
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 15m
          script: bash /opt/skillflow/scripts/deploy.sh
